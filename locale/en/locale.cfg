[mod-setting-description]
eon-remove-space-platform-restrictions=Removes all surface conditions. Space-platform-exclusive machines (crushers, thrusters, ...) can then be built on the surface, and planet machines with vanilla conditions (chests, burner furnaces, ...) can be placed on space platforms. When disabled, space platforms keep their vanilla restrictions while everything still works on Nauvis. Changing this setting requires a restart.
eon-holmium-ore=Replaces scrap with holmium ore as a minable resource on Nauvis, since scrap is somewhat overpowered. Changing this setting requires a restart and generating a new map.
eon-asteroid-chunk-stack-50=Asteroid chunks stack up to 50 instead of the vanilla stack size. Changing this setting requires a restart.
eon-nauvis2-clone=Adds a second planet (nauvis2), an exact clone of the merged Nauvis. For use by scenarios and other mods only: the primary nauvis planet/surface can never be dissociated (the engine forbids deleting it), so a scenario can only swap the map by running the game on the clone, which it can create and delete at will (LuaPlanet::create_surface; a created surface is deletable). Off by default: vanilla freeplay games keep a single Nauvis. Changing this setting requires a restart.
eon-restore-space-locations=Restores Vulcanus, Fulgora, Gleba and Aquilo as space locations you can travel to but cannot land on, the same as the solar system edge and the shattered planet. The normal trip progression comes back (nauvis to vulcanus/gleba/fulgora, on to aquilo, then the solar system edge) and every planet's asteroid field is kept, but no surface exists anywhere but Nauvis, so everything stays on Nauvis. When disabled, only Nauvis exists and the only trip is a straight shot to the solar system edge. Changing this setting requires a restart.

[space-location-name]
nauvis2=Nauvis
