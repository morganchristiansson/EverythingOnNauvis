[mod-setting-description]
eon-keep-space-platform-restrictions=Planet-exclusive machines and recipes (foundries, big mining drills, recyclers, ...) still work on Nauvis, but can no longer be placed or crafted on space platforms. Entries that are exclusive to space platforms in vanilla (crushers, thrusters, cargo bays, space science packs) remain restricted to space platforms either way. Changing this setting requires a restart.
eon-holmium-ore=Replaces scrap with holmium ore as a minable resource on Nauvis, since scrap is somewhat overpowered. Changing this setting requires a restart and generating a new map.
